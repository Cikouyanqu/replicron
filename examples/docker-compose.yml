# Turnkey three-container demo: PostgreSQL + MySQL + replicron.
#
#   docker compose -f examples/docker-compose.yml up -d --build
#
# Databases initialize themselves on first start (initdb/ scripts create and
# seed source_table / target_table); replicron then copies rows from Postgres
# into MySQL every minute. Open http://127.0.0.1:9101/ui to watch the runs.
#
# Host ports 55432/53306/9101 avoid clashing with locally installed engines.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports: ["55432:5432"]
    volumes:
      - ./initdb/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: demo
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    ports: ["53306:3306"]
    volumes:
      - ./initdb/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -pdemo"]
      interval: 5s
      timeout: 3s
      retries: 10

  replicron:
    build:
      context: ..
      args:
        # Mirrors restricted regions set GOPROXY in the environment, e.g.
        #   GOPROXY=https://goproxy.cn,direct docker compose ... up --build
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      SRC_DSN: postgres://demo:demo@postgres:5432/demo
      DST_DSN: demo:demo@tcp(mysql:3306)/demo
    volumes:
      - ./demo.yaml:/etc/replicron/demo.yaml:ro
      - runlog:/var/lib/replicron
    command: ["schedule", "-c", "/etc/replicron/demo.yaml", "--db", "/var/lib/replicron/runs.db", "--addr", ":9101", "--ui"]
    ports: ["9101:9101"]

volumes:
  runlog:
